# Phase-2 gate arm. mamba_padfix plus the horizon-bank init (short τ≈14 frames,
# mid τ≈75, long τ≈500), full-length decoder memory. Separates the effect of the
# bank init from the effect of pooling.
#
#   python src/train.py --data configs/data/isign.yaml --model configs/model/mamba_banks.yaml --lr 3e-4 --seed 42
arm: mamba_banks
d_model: 512
d_in: 356
enc_layers: 5
dec_layers: 3
n_heads: 8
dim_feedforward: 2048
dropout: 0.1
label_smoothing: 0.1
d_state: 64
expand: 2
headdim: 64
d_conv: 4
max_tgt_len: 64
short_heads: 8
mid_heads: 4
dt_weight_scale: 0.05
