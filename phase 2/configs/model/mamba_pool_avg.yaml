# CIF-style Δ pooling. Segments end at equal quantiles of the short bank's cumulative Δ,
# same count as mamba_uniform_avg, and each token is the Δ-weighted mean of its segment.
# Δ is the averaging weight, so the decoder loss trains it -- the gate's pick-one-frame arms
# (mamba_pool_matched) only select with Δ and never learn from that selection.
#
#   python src/train.py --data configs/data/isign.yaml --model configs/model/mamba_pool_avg.yaml --lr 3e-4 --seed 42
arm: mamba_pool_avg
d_model: 512
d_in: 356
enc_layers: 5
dec_layers: 3
n_heads: 8
dim_feedforward: 2048
dropout: 0.1
label_smoothing: 0.1
d_state: 64
expand: 2
headdim: 64
d_conv: 4
max_tgt_len: 64
pool_every_frames: 16
short_heads: 8
mid_heads: 4
dt_weight_scale: 0.05
