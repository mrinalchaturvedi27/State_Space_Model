# Phase-2 gate arm, the one the gate is about. Horizon-banked encoder; the decoder memory
# is the frames at equal quantiles of the short bank's cumulative Δ, with exactly as many
# frames per clip as mamba_uniform keeps (every pool_every_frames-th frame + the last).
# Same count, different positions: a gain over mamba_uniform is Δ choosing better frames.
#
#   python src/train.py --data configs/data/isign.yaml --model configs/model/mamba_pool_matched.yaml --lr 3e-4 --seed 42
arm: mamba_pool_matched
d_model: 512
d_in: 356
enc_layers: 5
dec_layers: 3
n_heads: 8
dim_feedforward: 2048
dropout: 0.1
label_smoothing: 0.1
d_state: 64
expand: 2
headdim: 64
d_conv: 4
max_tgt_len: 64
pool_every_frames: 16
short_heads: 8
mid_heads: 4
dt_weight_scale: 0.05
