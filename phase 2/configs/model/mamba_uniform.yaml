# Control for mamba_pool.yaml. Identical horizon-banked encoder, but the decoder
# memory is every pool_every_frames-th frame instead of the Δ-timed frames.
# A gain that appears here as well is just the effect of a shorter memory.
#
#   python src/train.py --data configs/data/isign.yaml --model configs/model/mamba_uniform.yaml --lr 3e-4 --seed 42
arm: mamba_uniform
d_model: 512
d_in: 356
enc_layers: 5
dec_layers: 3
n_heads: 8
dim_feedforward: 2048
dropout: 0.1
label_smoothing: 0.1
d_state: 64
expand: 2
headdim: 64
d_conv: 4
max_tgt_len: 64
pool_every_frames: 16
short_heads: 8
mid_heads: 4
dt_weight_scale: 0.05
