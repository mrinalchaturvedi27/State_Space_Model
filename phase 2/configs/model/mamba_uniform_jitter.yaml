# Why does random spacing beat a fixed stride? This arm keeps evenly spaced frames (same count
# as mamba_uniform) but shifts the grid by a random phase per clip during training, phase 0 at
# eval. jitter ~ random => the gain is the kept frames changing every epoch (regularisation);
# jitter ~ uniform => uneven spacing itself matters.
#
arm: mamba_uniform_jitter
d_model: 512
d_in: 356
enc_layers: 5
dec_layers: 3
n_heads: 8
dim_feedforward: 2048
dropout: 0.1
label_smoothing: 0.1
d_state: 64
expand: 2
headdim: 64
d_conv: 4
max_tgt_len: 64
pool_every_frames: 16
short_heads: 8
mid_heads: 4
dt_weight_scale: 0.05
