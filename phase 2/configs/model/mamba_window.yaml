# Selectivity control: mamba_padfix run on non-overlapping 128-frame windows (5.1 s, ~ the TCN's 121):
# no information crosses a window edge. If the long-clip lead disappears, it needs long-range memory.
#
arm: mamba_window
d_model: 512
d_in: 356
enc_layers: 5
dec_layers: 3
n_heads: 8
dim_feedforward: 2048
dropout: 0.1
label_smoothing: 0.1
d_state: 64
expand: 2
headdim: 64
d_conv: 4
max_tgt_len: 64
window_frames: 128
