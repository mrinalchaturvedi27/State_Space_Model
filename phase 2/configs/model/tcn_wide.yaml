# Selectivity control: the TCN with whole-clip reach (dilations 1..64 then 1: receptive field 513 frames).
# If it catches Mamba on long clips, any wide fixed window suffices; if not, it is Mamba-specific.
#
arm: tcn
tag: tcn_wide
d_model: 512
d_in: 356
enc_layers: 8
dec_layers: 3
n_heads: 8
dim_feedforward: 2048
dropout: 0.1
label_smoothing: 0.1
max_src_len: 512
max_tgt_len: 64
tcn_kernel: 5
tcn_dilations: [1, 2, 4, 8, 16, 32, 64, 1]
