# Step-4 control: the phase-1 Transformer + a convolutional stem (2 residual depthwise-separable
# temporal conv blocks, kernel 5, receptive field 9 frames) before the positional encoding.
# Tests whether local temporal modelling (Mamba-2 has a short conv in every layer) explains the gap.
#
arm: transformer_convstem
d_model: 512
d_in: 356
enc_layers: 6
dec_layers: 3
n_heads: 8
dim_feedforward: 2048
dropout: 0.1
label_smoothing: 0.1
max_src_len: 512
max_tgt_len: 64
stem_blocks: 2
stem_kernel: 5
