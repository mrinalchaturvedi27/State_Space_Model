# Control: the phase-1 Transformer encoder (identical config) + the same plain 16-frame
# averaging of the decoder memory as mamba_uniform_avg. Answers whether ~15x memory compression
# is specific to the SSM encoder. Adds no parameters over transformer.yaml.
#
arm: transformer_uniform_avg
d_model: 512
d_in: 356
enc_layers: 6
dec_layers: 3
n_heads: 8
dim_feedforward: 2048
dropout: 0.1
label_smoothing: 0.1
max_src_len: 512
max_tgt_len: 64
pool_every_frames: 16
